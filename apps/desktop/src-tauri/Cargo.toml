[package]
name = "clared"
version = "0.1.0"
description = "Clared desktop"
authors = ["you"]
edition = "2021"

[lib]
name = "clared_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Process-wide; only open_login_window loads a data URL (login-init).
tauri = { version = "2", features = ["webview-data-url"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
keyring = "4"
tauri-plugin-os = "2"
tauri-plugin-mcp-bridge = "0.12"
tauri-plugin-store = "2"
tauri-plugin-prevent-default = "5"
