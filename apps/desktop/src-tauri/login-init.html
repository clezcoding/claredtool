<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'"
    />
    <title>Anmelden</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: hsl(222 47% 11%);
      }
      .stage {
        min-height: 100%;
        display: grid;
        place-items: center;
      }
      .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid hsl(215 20% 65% / 0.35);
        border-top-color: hsl(215 20% 65%);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation: none;
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="spinner" aria-hidden="true"></div>
      <span class="sr-only">Wird geladen</span>
    </div>
  </body>
</html>
