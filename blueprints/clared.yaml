# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# One OAuth application named clared per Authentik instance (D-13).
# Same file local and prod. Override context.backend_callback on the
# blueprint instance for Coolify (https://api.example/auth/callback).
# Do not set client_secret here — copy the generated SECRET into Coolify
# env only, never the laptop production secret (D-13).
version: 1
metadata:
  name: clared
context:
  backend_callback: http://localhost:3000/auth/callback
entries:
  - model: authentik_core.group
    identifiers:
      name: clared-platform
    attrs:
      name: clared-platform
  - model: authentik_core.group
    identifiers:
      name: clared-owner
    attrs:
      name: clared-owner
  - model: authentik_core.group
    identifiers:
      name: clared-admin
    attrs:
      name: clared-admin
  - model: authentik_core.group
    identifiers:
      name: clared-accountant
    attrs:
      name: clared-accountant
  - model: authentik_core.group
    identifiers:
      name: clared-clerk
    attrs:
      name: clared-clerk
  - model: authentik_core.group
    identifiers:
      name: clared-tax
    attrs:
      name: clared-tax
  - model: authentik_core.group
    identifiers:
      name: clared-auditor
    attrs:
      name: clared-auditor
  - model: authentik_core.group
    identifiers:
      name: clared-viewer
    attrs:
      name: clared-viewer
  - id: groups-mapping
    model: authentik_providers_oauth2.scopemapping
    identifiers:
      managed: clared.io/providers/oauth2/scope-groups
    attrs:
      name: "Clared OAuth Mapping: OpenID 'groups'"
      scope_name: groups
      expression: |
        return {
          "groups": [group.name for group in request.user.ak_groups.all()],
        }
  - id: provider
    model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: clared
    attrs:
      name: clared
      client_id: clared
      client_type: confidential
      include_claims_in_id_token: true
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      redirect_uris:
        - matching_mode: strict
          url: !Context backend_callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf groups-mapping
  - model: authentik_core.application
    identifiers:
      slug: clared
    attrs:
      name: clared
      slug: clared
      provider: !KeyOf provider
      meta_launch_url: !Context backend_callback
