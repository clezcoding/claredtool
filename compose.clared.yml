services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clared
      POSTGRES_USER: clared_app
      POSTGRES_PASSWORD: clared_app_dev
    ports:
      - "5432:5432"
    volumes:
      - clared_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clared_app -d clared"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - clared_redis:/data

volumes:
  clared_pg:
  clared_redis:
