services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: clared
      POSTGRES_USER: clared_app
      POSTGRES_PASSWORD: clared_app_dev
    ports:
      - "5432:5432"
    volumes:
      - clared_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clared_app -d clared"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - clared_redis:/data

  gotenberg:
    image: gotenberg/gotenberg:8.36.0
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      API_ENABLE_BASIC_AUTH: "true"
      GOTENBERG_API_BASIC_AUTH_USERNAME: "${GOTENBERG_API_BASIC_AUTH_USERNAME:-dev}"
      GOTENBERG_API_BASIC_AUTH_PASSWORD: "${GOTENBERG_API_BASIC_AUTH_PASSWORD:-dev}"
      API_TIMEOUT: "30s"
      API_DISABLE_DOWNLOAD_FROM: "true"
      CHROMIUM_DENY_PRIVATE_IPS: "true"
      CHROMIUM_DENY_PUBLIC_IPS: "true"

  worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: worker
    command: node dist/worker.js
    depends_on:
      - redis
      - gotenberg
    environment:
      REDIS_URL: redis://redis:6379
      GOTENBERG_URL: http://gotenberg:3000
      GOTENBERG_API_BASIC_AUTH_USERNAME: "${GOTENBERG_API_BASIC_AUTH_USERNAME:-dev}"
      GOTENBERG_API_BASIC_AUTH_PASSWORD: "${GOTENBERG_API_BASIC_AUTH_PASSWORD:-dev}"
      OTEL_TRACES_EXPORTER: none
      OTEL_LOGS_EXPORTER: none

volumes:
  clared_pg:
  clared_redis:
