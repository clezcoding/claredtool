# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      nestjs-major:
        applies-to: version-updates
        patterns:
          - "@nestjs/*"
        update-types:
          - major
      npm-patch-minor:
        update-types:
          - patch
          - minor
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - cargo
    commit-message:
      prefix: "chore"
      include: scope
    # gtk-rs 0.18 (Tauri 2 Linux) requires glib ^0.18. GHSA-wrw7-89jp-8q8g
    # is fixed in glib 0.20, which cannot resolve until Tauri moves gtk-rs.
    ignore:
      - dependency-name: glib
        versions:
          - ">=0.19.0"
    groups:
      cargo-patch-minor:
        update-types:
          - patch
          - minor
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:30"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      actions-patch-minor:
        update-types:
          - patch
          - minor
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /apps/backend
    schedule:
      interval: monthly
      time: "06:45"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore"
      include: scope
    # Node 24 LTS lock: major bumps (25+) need explicit upgrade validation (corepack, Prisma, Nest).
    ignore:
      - dependency-name: node
        versions:
          - ">=25"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
      time: "07:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore"
      include: scope
