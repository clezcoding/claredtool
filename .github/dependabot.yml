# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: scope
    groups:
      npm-patch-minor:
        update-types:
          - patch
          - minor
        patterns:
          - "*"
      npm-major:
        update-types:
          - major
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - cargo
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      cargo-patch-minor:
        update-types:
          - patch
          - minor
        patterns:
          - "*"
      cargo-major:
        update-types:
          - major
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      actions-patch-minor:
        update-types:
          - patch
          - minor
        patterns:
          - "*"
      actions-major:
        update-types:
          - major
        patterns:
          - "*"
