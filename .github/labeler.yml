# Path/branch labels for pull requests. Names must exist in labels.yml.
# sync-labels stays off so automerge / do-not-merge are never stripped.

desktop:
  - changed-files:
      - any-glob-to-any-file: apps/desktop/**

ui:
  - changed-files:
      - any-glob-to-any-file: packages/ui/**

ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**
          - .github/dependabot.yml
          - .github/labeler.yml
          - .github/labels.yml
          - .kodiak.toml

planning:
  - changed-files:
      - any-glob-to-any-file: .planning/**

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - README.md
          - docs/**
          - apps/*/README.md
          - packages/*/README.md

dependencies:
  - head-branch: ['^dependabot/']

backend:
  - changed-files:
      - any-glob-to-any-file: apps/backend/**

tax-engine:
  - changed-files:
      - any-glob-to-any-file:
          - packages/tax-engine/**
          - packages/tax-engine/src/schema/clared-tax-rule-dsl-schema.json

docker:
  - changed-files:
      - any-glob-to-any-file:
          - apps/backend/Dockerfile
          - compose.yml
          - compose.clared.yml
          - .dockerignore

infrastructure:
  - changed-files:
      - any-glob-to-any-file:
          - apps/backend/Dockerfile
          - compose.yml
          - compose.clared.yml
          - .dockerignore
          - .github/workflows/backend-image.yml
