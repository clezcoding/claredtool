name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            desktop:
              - 'apps/desktop/**'
              - 'packages/ui/**'
            backend:
              - 'apps/backend/**'
              - 'packages/tax-engine/src/schema/clared-tax-rule-dsl-schema.json'
            tax-engine:
              - 'packages/tax-engine/**'
            shared:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - '.github/workflows/ci.yml'
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
      backend: ${{ steps.filter.outputs.backend }}
      tax-engine: ${{ steps.filter.outputs.tax-engine }}
      shared: ${{ steps.filter.outputs.shared }}

  lint:
    needs: changes
    if: |
      github.ref == 'refs/heads/main' ||
      needs.changes.outputs.desktop == 'true' ||
      needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter ./apps/desktop exec tsc --noEmit

      - run: pnpm --filter ./apps/desktop build

  desktop-test:
    needs: changes
    if: |
      github.ref == 'refs/heads/main' ||
      needs.changes.outputs.desktop == 'true' ||
      needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.97.1"

      - uses: swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: cargo fmt --check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - run: cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings

      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

      - run: pnpm --filter ./apps/desktop test

  backend-unit:
    needs: changes
    if: |
      github.ref == 'refs/heads/main' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.shared == 'true' ||
      needs.changes.outputs.tax-engine == 'true'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://prisma-test:unused@127.0.0.1:5432/clared
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @clared/tax-engine build

      - run: pnpm --filter ./apps/backend exec prisma generate

      - run: pnpm --filter ./apps/backend exec prisma validate

      - run: pnpm --filter ./apps/backend exec nest build

      - run: pnpm --filter ./apps/backend test

      - run: pnpm --filter @clared/tax-engine test

  backend-e2e:
    needs: changes
    if: |
      github.ref == 'refs/heads/main' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.shared == 'true' ||
      needs.changes.outputs.tax-engine == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clared
          POSTGRES_USER: prisma-test
          POSTGRES_PASSWORD: unused
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma-test -d clared"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://prisma-test:unused@127.0.0.1:5432/clared
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @clared/tax-engine build

      - run: pnpm --filter ./apps/backend exec prisma migrate deploy

      - run: pnpm --filter ./apps/backend test:e2e

  ci:
    needs: [changes, lint, desktop-test, backend-unit, backend-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          check() {
            local name="$1"
            local result="$2"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "$name: $result"
              exit 1
            fi
          }
          check changes "${{ needs.changes.result }}"
          check lint "${{ needs.lint.result }}"
          check desktop-test "${{ needs.desktop-test.result }}"
          check backend-unit "${{ needs.backend-unit.result }}"
          check backend-e2e "${{ needs.backend-e2e.result }}"
