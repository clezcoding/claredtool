name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
      backend: ${{ steps.filter.outputs.backend }}
      tax-engine: ${{ steps.filter.outputs.tax-engine }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            desktop:
              - 'apps/desktop/**'
              - 'packages/ui/**'
            backend:
              - 'apps/backend/**'
            tax-engine:
              - 'packages/tax-engine/**'
            shared:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'packages/ui/**'
              - '.github/workflows/ci.yml'

  lint:
    needs: changes
    if: |
      github.ref == 'refs/heads/main' ||
      needs.changes.outputs.desktop == 'true' ||
      needs.changes.outputs.shared == 'true' ||
      needs.changes.outputs.tax-engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install

      - run: pnpm --filter ./apps/desktop exec tsc --noEmit

  desktop-test:
    needs: changes
    if: |
      github.ref == 'refs/heads/main' ||
      needs.changes.outputs.desktop == 'true' ||
      needs.changes.outputs.shared == 'true' ||
      needs.changes.outputs.tax-engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install

      - run: pnpm --filter ./apps/desktop test

  backend-unit:
    needs: changes
    if: |
      github.ref == 'refs/heads/main' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.shared == 'true' ||
      needs.changes.outputs.tax-engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install

      - run: pnpm --filter @clared/tax-engine build

      - run: pnpm --filter ./apps/backend exec nest build

      - run: pnpm --filter ./apps/backend test

      - run: pnpm --filter @clared/tax-engine test

  backend-e2e:
    needs: changes
    if: |
      github.ref == 'refs/heads/main' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.shared == 'true' ||
      needs.changes.outputs.tax-engine == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clared
          POSTGRES_USER: prisma-test
          POSTGRES_PASSWORD: unused
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma-test -d clared"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://prisma-test:unused@127.0.0.1:5432/clared
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install

      - run: pnpm --filter @clared/tax-engine build

      - run: pnpm --filter ./apps/backend exec prisma migrate deploy

      - run: pnpm --filter ./apps/backend test:e2e

  ci:
    needs: [changes, lint, desktop-test, backend-unit, backend-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          check() {
            local name="$1"
            local result="$2"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "$name: $result"
              exit 1
            fi
          }
          check changes "${{ needs.changes.result }}"
          check lint "${{ needs.lint.result }}"
          check desktop-test "${{ needs.desktop-test.result }}"
          check backend-unit "${{ needs.backend-unit.result }}"
          check backend-e2e "${{ needs.backend-e2e.result }}"
