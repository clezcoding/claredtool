name: ci
run-name: ${{ github.event_name == 'pull_request' && format('CI · {0} · PR {1} · {2}', github.event_name, github.event.pull_request.number, github.head_ref) || format('CI · {0} · {1}', github.event_name, github.ref_name) }}

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            desktop-web:
              - 'apps/desktop/src/**'
              - 'apps/desktop/index.html'
              - 'apps/desktop/package.json'
              - 'apps/desktop/vite.config.ts'
              - 'apps/desktop/vitest.config.ts'
              - 'apps/desktop/tsconfig.json'
              - 'apps/desktop/tsconfig.node.json'
              - 'apps/desktop/scripts/**'
              - 'packages/ui/**'
            desktop-rust:
              - 'apps/desktop/src-tauri/**'
              - 'apps/desktop/src-tauri/rust-toolchain.toml'
            backend:
              - 'apps/backend/**'
              - 'packages/tax-engine/src/schema/clared-tax-rule-dsl-schema.json'
            tax-engine:
              - 'packages/tax-engine/**'
            shared:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - '.github/workflows/ci.yml'
    outputs:
      desktop-web: ${{ steps.filter.outputs.desktop-web }}
      desktop-rust: ${{ steps.filter.outputs.desktop-rust }}
      backend: ${{ steps.filter.outputs.backend }}
      tax-engine: ${{ steps.filter.outputs.tax-engine }}
      shared: ${{ steps.filter.outputs.shared }}

  desktop-web:
    timeout-minutes: 15
    needs: changes
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (needs.changes.outputs.desktop-web == 'true' || needs.changes.outputs.shared == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-pnpm-ci

      - run: pnpm install --frozen-lockfile --filter ./apps/desktop...

      - run: pnpm --filter ./apps/desktop exec tsc --noEmit

      - run: pnpm --filter ./apps/desktop test

      - run: pnpm --filter ./apps/desktop build

  desktop-rust:
    timeout-minutes: 15
    needs: changes
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (needs.changes.outputs.desktop-rust == 'true' || needs.changes.outputs.shared == 'true')
    runs-on: ubuntu-24.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Tauri Linux dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if timeout 90 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update \
              && timeout 180 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils; then
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying"
            sleep 5
          done
          echo "apt-get failed after 3 attempts"
          exit 1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      - run: cargo fmt --check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - run: cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings

      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

  backend-test:
    timeout-minutes: 30
    needs: changes
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.tax-engine == 'true')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clared
          POSTGRES_USER: prisma-test
          POSTGRES_PASSWORD: unused
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma-test -d clared"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://prisma-test:unused@127.0.0.1:5432/clared
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-pnpm-ci

      - run: pnpm install --frozen-lockfile --filter @clared/tax-engine... --filter ./apps/backend...

      - run: pnpm --filter @clared/tax-engine build

      - run: pnpm --filter ./apps/backend exec prisma generate

      - run: pnpm --filter ./apps/backend exec prisma validate

      - run: pnpm --filter ./apps/backend exec nest build

      - run: pnpm --filter ./apps/backend test

      - run: pnpm --filter @clared/tax-engine test

      - run: pnpm --filter ./apps/backend exec prisma migrate deploy

      - run: pnpm --filter ./apps/backend test:e2e

  # G5: squawk-cli on Node 24. The GitHub composite action (v2.1.0)
  # hardcodes setup-node node-version 20 — do not uses it.
  # Prisma 7: migrate deploy then diff --from-config-datasource (no shadow URL).
  squawk:
    timeout-minutes: 15
    needs: changes
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.tax-engine == 'true')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clared
          POSTGRES_USER: prisma-test
          POSTGRES_PASSWORD: unused
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma-test -d clared"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://prisma-test:unused@127.0.0.1:5432/clared
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm-ci

      - run: pnpm install --frozen-lockfile

      - name: Install squawk-cli
        run: npm install -g squawk-cli@2.64.0

      - name: Lint committed Prisma migrations
        run: |
          set -euo pipefail
          mapfile -d '' sql < <(
            find apps/backend/prisma/migrations -name '*.sql' -print0 \
              | grep -zEv '20260822014200_init|20260822155017_product_entities_invoices_tax|20260822180000_invoice_dates' \
              || true
          )
          if [ ${#sql[@]} -eq 0 ] || [ -z "${sql[0]:-}" ]; then
            echo "No new migration SQL (20260822 baseline excluded)"
          else
            squawk --config .squawk.toml --pg-version 16 "${sql[@]}"
          fi

      - name: Diff schema vs migrations and lint pending SQL
        run: |
          set -euo pipefail
          pnpm --filter ./apps/backend exec prisma migrate deploy
          pnpm --filter ./apps/backend exec prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --script > "${RUNNER_TEMP}/pending.sql"
          if grep -Eqv '^[[:space:]]*(--.*)?$' "${RUNNER_TEMP}/pending.sql"; then
            squawk --pg-version 16 "${RUNNER_TEMP}/pending.sql"
          else
            echo "No pending SQL (schema matches applied migrations)"
          fi

  ci:
    timeout-minutes: 5
    needs: [changes, desktop-web, desktop-rust, backend-test, squawk]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check job results
        run: |
          check() {
            local name="$1"
            local result="$2"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "$name: $result"
              exit 1
            fi
          }
          check changes "${{ needs.changes.result }}"
          check desktop-web "${{ needs.desktop-web.result }}"
          check desktop-rust "${{ needs.desktop-rust.result }}"
          check backend-test "${{ needs.backend-test.result }}"
          check squawk "${{ needs.squawk.result }}"
