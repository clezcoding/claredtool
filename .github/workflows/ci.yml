name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clared
          POSTGRES_USER: prisma-test
          POSTGRES_PASSWORD: unused
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma-test -d clared"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://prisma-test:unused@127.0.0.1:5432/clared
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install

      - run: pnpm --filter ./apps/desktop exec tsc --noEmit

      - run: pnpm --filter ./apps/desktop test

      - run: pnpm --filter @clared/tax-engine build

      - run: pnpm --filter ./apps/backend exec prisma migrate deploy

      - run: pnpm --filter ./apps/backend test:e2e

      - run: pnpm --filter ./apps/backend test

      - run: pnpm --filter @clared/tax-engine test
