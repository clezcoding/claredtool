# GHA builds Nest images; Coolify only pulls them.
# API: default stage (CMD node dist/main.js) tag sha-<7>.
# Worker: --target worker (CMD node dist/worker.js) tag sha-<7>-worker.
# Coolify 4.3.14 dockerimage pack ignores start_command.
# Prisma migrate deploy runs once in the migrate job (environment production)
# before Coolify deploy. API replicas must not race migrate at process start.
# Deploy job: PATCH tag + POST /deploy when vars.COOLIFY_IMAGE_DEPLOY=true.
# Official Coolify pattern: GHCR push + deploy API (coolify.io/docs/applications/ci-cd/github/actions).
# Vs the sample workflow: path filter, buildx GHA cache, metadata-action, immutable sha- tag,
# one build / two deploys, linux/amd64 only.
# TECH-DEBT: provenance and sbom stay false — Coolify cannot pull attestation
# indexes; re-enable after a Coolify upgrade that can.

name: backend-image

on:
  push:
    branches:
      - main
    paths:
      - apps/backend/**
      - packages/tax-engine/**
      - apps/backend/Dockerfile
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .npmrc
      - .dockerignore
      - packages/tax-engine/src/schema/clared-tax-rule-dsl-schema.json
      - .github/workflows/backend-image.yml
  workflow_dispatch:
    inputs:
      deploy:
        description: Redeploy clared-api and clared-worker after push
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 45
    concurrency:
      group: backend-image-build-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha_tag: ${{ steps.image.outputs.sha_tag }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}

      - id: image
        run: |
          echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # TECH-DEBT: GHCR attestations stay off — Coolify cannot pull
      # attestation indexes. Re-enable after a Coolify upgrade that can.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/backend/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=clared-backend
          cache-to: type=gha,scope=clared-backend,mode=max

      # Coolify 4.3.14 dockerimage pack ignores start_command (same as dockerfile).
      # Worker stage CMD is node dist/worker.js — separate tag, not an override.
      # TECH-DEBT: GHCR attestations stay off — Coolify cannot pull
      # attestation indexes. Re-enable after a Coolify upgrade that can.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/backend/Dockerfile
          target: worker
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.image.outputs.sha_tag }}-worker
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=clared-backend

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}:${{ steps.image.outputs.sha_tag }}
          scan-type: image
          format: table
          scanners: vuln
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          skip-files: '**/typescript-linux-x64/lib/tsc'

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}:${{ steps.image.outputs.sha_tag }}-worker
          scan-type: image
          format: table
          scanners: vuln
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          skip-files: '**/typescript-linux-x64/lib/tsc'

  migrate:
    needs: build
    if: |
      needs.build.result == 'success' &&
      vars.COOLIFY_IMAGE_DEPLOY == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_dispatch' || inputs.deploy)
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Skip migrate when DATABASE_URL is unset
        if: ${{ env.DATABASE_URL == '' }}
        run: |
          echo "No GitHub Environment production DATABASE_URL."
          echo "Coolify Postgres uses Docker-internal DNS; GitHub-hosted runners cannot reach it."
          echo "API image CMD still runs prisma migrate deploy (single replica)."

      - if: ${{ env.DATABASE_URL != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: ${{ env.DATABASE_URL != '' }}
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - if: ${{ env.DATABASE_URL != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - if: ${{ env.DATABASE_URL != '' }}
        run: pnpm install --frozen-lockfile

      - name: Apply Prisma migrations
        if: ${{ env.DATABASE_URL != '' }}
        run: pnpm --filter ./apps/backend exec prisma migrate deploy

  deploy:
    needs: [build, migrate]
    if: |
      needs.build.result == 'success' &&
      vars.COOLIFY_IMAGE_DEPLOY == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_dispatch' || inputs.deploy)
    # GitHub UI (YAML cannot set): required reviewers; deployment branches
    # main plus v* tags; do not add a wait timer that blocks this private-repo CI.
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: coolify-nest-deploy
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        app:
          - name: clared-api
            uuid_var: COOLIFY_APP_API
            tag_suffix: ""
          - name: clared-worker
            uuid_var: COOLIFY_APP_WORKER
            tag_suffix: "-worker"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Pin sha tag and deploy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          APP_UUID: ${{ vars[matrix.app.uuid_var] }}
          APP_NAME: ${{ matrix.app.name }}
          SHA_TAG: ${{ needs.build.outputs.sha_tag }}${{ matrix.app.tag_suffix }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -euo pipefail
          test -n "$COOLIFY_TOKEN"
          test -n "$COOLIFY_URL"
          test -n "$APP_UUID"
          test -n "$SHA_TAG"
          test -n "$APP_NAME"
          APP_JSON=$(curl -fsS -X GET "${COOLIFY_URL}/api/v1/applications/${APP_UUID}" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Accept: application/json")
          PREV_TAG=$(printf '%s' "$APP_JSON" | jq -r '.docker_registry_image_tag // empty')
          curl -fsS -X PATCH "${COOLIFY_URL}/api/v1/applications/${APP_UUID}" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d "{\"docker_registry_image_name\":\"${IMAGE}\",\"docker_registry_image_tag\":\"${SHA_TAG}\"}"
          # Coolify 4.3.14: GET /api/v1/deploy is 405; POST JSON body is the working verb.
          curl -fsS -X POST "${COOLIFY_URL}/api/v1/deploy" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d "{\"uuid\":\"${APP_UUID}\",\"force\":true}"

          poll_ok=0
          for _ in $(seq 1 30); do
            if [ "$APP_NAME" = "clared-api" ]; then
              code=$(curl -sS -o /dev/null -w "%{http_code}" \
                "https://clared-api.puzzlessdev.online/health/ready" || true)
              if [ "$code" = "200" ]; then
                poll_ok=1
                break
              fi
            else
              STATUS_JSON=$(curl -fsS -X GET "${COOLIFY_URL}/api/v1/applications/${APP_UUID}" \
                -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
                -H "Accept: application/json" || true)
              STATUS=$(printf '%s' "${STATUS_JSON:-}" | jq -r '.status // empty' 2>/dev/null || true)
              STATUS_LC=$(printf '%s' "$STATUS" | tr '[:upper:]' '[:lower:]')
              case "$STATUS_LC" in
                *running*)
                  poll_ok=1
                  break
                  ;;
              esac
            fi
            sleep 10
          done

          if [ "$poll_ok" != "1" ]; then
            if [ -n "$PREV_TAG" ]; then
              echo "Health poll failed for ${APP_NAME}; rolling back to ${PREV_TAG}"
              curl -fsS -X PATCH "${COOLIFY_URL}/api/v1/applications/${APP_UUID}" \
                -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
                -H "Accept: application/json" \
                -H "Content-Type: application/json" \
                -d "{\"docker_registry_image_name\":\"${IMAGE}\",\"docker_registry_image_tag\":\"${PREV_TAG}\"}"
              curl -fsS -X POST "${COOLIFY_URL}/api/v1/deploy" \
                -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
                -H "Accept: application/json" \
                -H "Content-Type: application/json" \
                -d "{\"uuid\":\"${APP_UUID}\",\"force\":true}"
            else
              echo "Health poll failed for ${APP_NAME}; rollback is impossible (previous docker_registry_image_tag is empty)"
            fi
            exit 1
          fi
