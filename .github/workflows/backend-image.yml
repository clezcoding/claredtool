# GHA builds Nest images; Coolify only pulls them.
# API: default stage (migrate + main.js) tag sha-<7>.
# Worker: --target worker (CMD node dist/worker.js) tag sha-<7>-worker.
# Coolify 4.3.14 dockerimage pack ignores start_command.
# Deploy job: PATCH tag + POST /deploy when vars.COOLIFY_IMAGE_DEPLOY=true.
# Official Coolify pattern: GHCR push + deploy API (coolify.io/docs/applications/ci-cd/github/actions).
# Vs the sample workflow: path filter, buildx GHA cache, metadata-action, immutable sha- tag,
# one build / two deploys, linux/amd64 only, provenance off (Coolify pull of attestation indexes is flaky).

name: backend-image

on:
  push:
    branches:
      - main
    paths:
      - apps/backend/**
      - packages/tax-engine/**
      - apps/backend/Dockerfile
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .npmrc
      - .dockerignore
      - packages/tax-engine/src/schema/clared-tax-rule-dsl-schema.json
      - .github/workflows/backend-image.yml
  workflow_dispatch:
    inputs:
      deploy:
        description: Redeploy clared-api and clared-worker after push
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  build:
    concurrency:
      group: backend-image-build-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha_tag: ${{ steps.image.outputs.sha_tag }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}

      - id: image
        run: |
          echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/backend/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=clared-backend
          cache-to: type=gha,scope=clared-backend,mode=max

      # Coolify 4.3.14 dockerimage pack ignores start_command (same as dockerfile).
      # Worker stage CMD is node dist/worker.js — separate tag, not an override.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/backend/Dockerfile
          target: worker
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.image.outputs.sha_tag }}-worker
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=clared-backend

  deploy:
    needs: build
    if: |
      needs.build.result == 'success' &&
      vars.COOLIFY_IMAGE_DEPLOY == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_dispatch' || inputs.deploy)
    runs-on: ubuntu-latest
    concurrency:
      group: coolify-nest-deploy
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        app:
          - name: clared-api
            uuid_var: COOLIFY_APP_API
            tag_suffix: ""
          - name: clared-worker
            uuid_var: COOLIFY_APP_WORKER
            tag_suffix: "-worker"
    steps:
      - name: Pin sha tag and deploy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          APP_UUID: ${{ vars[matrix.app.uuid_var] }}
          SHA_TAG: ${{ needs.build.outputs.sha_tag }}${{ matrix.app.tag_suffix }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -euo pipefail
          test -n "$COOLIFY_TOKEN"
          test -n "$COOLIFY_URL"
          test -n "$APP_UUID"
          test -n "$SHA_TAG"
          curl -fsS -X PATCH "${COOLIFY_URL}/api/v1/applications/${APP_UUID}" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d "{\"docker_registry_image_name\":\"${IMAGE}\",\"docker_registry_image_tag\":\"${SHA_TAG}\"}"
          # Coolify 4.3.14: GET /api/v1/deploy is 405; POST JSON body is the working verb.
          curl -fsS -X POST "${COOLIFY_URL}/api/v1/deploy" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d "{\"uuid\":\"${APP_UUID}\",\"force\":true}"
