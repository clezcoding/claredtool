# GHA builds Nest API image; Coolify only pulls it.
# API: default stage (CMD prisma migrate deploy && node dist/main.js) tag sha-<7>.
# Worker stage/tag removed (D-09 / 04.6 Takumi cutover). Coolify 4.3.14 dockerimage
# pack ignores start_command. API container CMD is the only migrator. Multi-replica
# later needs exactly one external migrator (brief 6.6) — do not activate.
# Deploy job: PATCH tag + POST /deploy when vars.COOLIFY_IMAGE_DEPLOY=true.
# Official Coolify pattern: GHCR push + deploy API (coolify.io/docs/applications/ci-cd/github/actions).
# Vs the sample workflow: path filter, buildx GHA cache, metadata-action, immutable sha- tag,
# one build / one API-only deploy, linux/amd64 only.
# TECH-DEBT: provenance and sbom stay false — Coolify cannot pull attestation
# indexes; re-enable after a Coolify upgrade that can.

name: backend-image
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Backend image · manual · {0} · deploy={1}', github.ref_name, inputs.deploy) || format('Backend image · push · {0}', github.ref_name) }}

on:
  push:
    branches:
      - main
    paths:
      - apps/backend/**
      - packages/tax-engine/**
      - packages/pdf-templates/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .npmrc
      - .dockerignore
      - .github/workflows/backend-image.yml
      - .github/scripts/coolify-deploy-nest.sh
      - .github/scripts/coolify-deploy-nest.test.sh
  workflow_dispatch:
    inputs:
      deploy:
        description: Redeploy clared-api after push
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

# No workflow-level concurrency: cancel-in-progress at workflow scope cancels
# EVERY job in the prior run, including an in-flight Coolify deploy (half-pin).
# Cancel stale builds only via per-job groups below.
# Deploy: coolify-nest-deploy, cancel-in-progress: false.

jobs:
  deploy-script-test:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv/uvx not on ubuntu-24.04 runners; needed for zizmor in coolify-deploy-nest.test.sh
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.15"

      - name: Coolify deploy mock tests (REL-01)
        run: bash .github/scripts/coolify-deploy-nest.test.sh

  push-api:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 45
    runs-on: ubuntu-latest
    concurrency:
      group: backend-image-${{ github.ref }}-push-api
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: write
    outputs:
      digest: ${{ steps.push-api.outputs.digest }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,format=short

      - id: image
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          echo "image=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # TECH-DEBT: GHCR attestations stay off — Coolify cannot pull
      # attestation indexes. Re-enable after a Coolify upgrade that can.
      # G8 SBOM/cosign below uses Syft + keyless sigstore, not buildx attestations.
      - id: push-api
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/backend/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ steps.image.outputs.sha_tag }}
          cache-from: type=gha,scope=clared-backend-api
          cache-to: type=gha,scope=clared-backend-api,mode=max

  build:
    needs: [deploy-script-test, push-api]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 45
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: write
    outputs:
      sha_tag: ${{ steps.image.outputs.sha_tag }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          echo "image=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}:${{ steps.image.outputs.sha_tag }}
          scan-type: image
          format: table
          scanners: vuln
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          skip-files: '**/typescript-linux-x64/lib/tsc'

      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.image.outputs.image }}:${{ steps.image.outputs.sha_tag }}
          format: spdx-json
          artifact-name: clared-api-${{ steps.image.outputs.sha_tag }}.spdx.json
          upload-release-assets: false
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      # ponytail: cosign-installer has no checksum input; the SHA-pinned action
      # verifies the v3.0.6 release blob internally (bootstrap_linux_amd64_sha).
      # Residual risk: compromised github.com release at job runtime — upgrade
      # path: vendor binary or newer installer with explicit digest inputs.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign images (keyless OIDC)
        env:
          DIGEST_API: ${{ needs.push-api.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          test -n "$DIGEST_API"
          cosign sign --yes "${IMAGE}@${DIGEST_API}"

      - name: Step summary
        if: always()
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          SHA_TAG: ${{ steps.image.outputs.sha_tag }}
        run: |
          {
            echo "## backend-image build"
            echo "- API: ${IMAGE}:${SHA_TAG}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [build]
    if: |
      needs.build.result == 'success' &&
      vars.COOLIFY_IMAGE_DEPLOY == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_dispatch' || inputs.deploy)
    # GitHub UI (YAML cannot set): required reviewers; deployment branches
    # main plus v* tags; do not add a wait timer that blocks this private-repo CI.
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: coolify-nest-deploy
      cancel-in-progress: false
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # D-09: API-only pin + /health/ready poll (04.5 worker half superseded).
      - name: Deploy API
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          API_UUID: ${{ vars.COOLIFY_APP_API }}
          SHA_TAG: ${{ needs.build.outputs.sha_tag }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: bash .github/scripts/coolify-deploy-nest.sh
