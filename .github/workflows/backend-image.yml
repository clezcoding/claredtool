# GHA builds Nest images; Coolify only pulls them.
# API: default stage (CMD prisma migrate deploy && node dist/main.js) tag sha-<7>.
# Worker: --target worker (CMD node dist/worker.js) tag sha-<7>-worker.
# Coolify 4.3.14 dockerimage pack ignores start_command.
# API container CMD is the only migrator. Multi-replica later needs exactly one
# external migrator (brief 6.6) — do not activate.
# Deploy job: PATCH tag + POST /deploy when vars.COOLIFY_IMAGE_DEPLOY=true.
# Official Coolify pattern: GHCR push + deploy API (coolify.io/docs/applications/ci-cd/github/actions).
# Vs the sample workflow: path filter, buildx GHA cache, metadata-action, immutable sha- tag,
# one build / one ordered deploy (API then worker), linux/amd64 only.
# TECH-DEBT: provenance and sbom stay false — Coolify cannot pull attestation
# indexes; re-enable after a Coolify upgrade that can.

name: backend-image

on:
  push:
    branches:
      - main
    paths:
      - apps/backend/**
      - packages/tax-engine/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .npmrc
      - .dockerignore
      - .github/workflows/backend-image.yml
  workflow_dispatch:
    inputs:
      deploy:
        description: Redeploy clared-api and clared-worker after push
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 45
    concurrency:
      group: backend-image-build-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: write
    outputs:
      sha_tag: ${{ steps.image.outputs.sha_tag }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}

      - id: image
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          echo "image=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # A5 / D-20: Bake aborted. bake-action exposes one metadata JSON blob, not
      # named DIGEST_API / DIGEST_WORKER outputs. Feeding cosign would need extra
      # fromJSON/jq; sha vs sha-*-worker tags stay clearer with two build-push
      # steps (each outputs.digest). provenance/sbom stay false.
      # TECH-DEBT: GHCR attestations stay off — Coolify cannot pull
      # attestation indexes. Re-enable after a Coolify upgrade that can.
      # G8 SBOM/cosign below uses Syft + keyless sigstore, not buildx attestations.
      - id: push-api
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/backend/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=clared-backend
          cache-to: type=gha,scope=clared-backend,mode=max

      # Coolify 4.3.14 dockerimage pack ignores start_command (same as dockerfile).
      # Worker stage CMD is node dist/worker.js — separate tag, not an override.
      # TECH-DEBT: GHCR attestations stay off — Coolify cannot pull
      # attestation indexes. Re-enable after a Coolify upgrade that can.
      - id: push-worker
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/backend/Dockerfile
          target: worker
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.image.outputs.sha_tag }}-worker
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=clared-backend

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}:${{ steps.image.outputs.sha_tag }}
          scan-type: image
          format: table
          scanners: vuln
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          skip-files: '**/typescript-linux-x64/lib/tsc'

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}:${{ steps.image.outputs.sha_tag }}-worker
          scan-type: image
          format: table
          scanners: vuln
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          skip-files: '**/typescript-linux-x64/lib/tsc'

      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.image.outputs.image }}:${{ steps.image.outputs.sha_tag }}
          format: spdx-json
          artifact-name: clared-api-${{ steps.image.outputs.sha_tag }}.spdx.json
          upload-release-assets: false
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.image.outputs.image }}:${{ steps.image.outputs.sha_tag }}-worker
          format: spdx-json
          artifact-name: clared-worker-${{ steps.image.outputs.sha_tag }}.spdx.json
          upload-release-assets: false
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign images (keyless OIDC)
        env:
          DIGEST_API: ${{ steps.push-api.outputs.digest }}
          DIGEST_WORKER: ${{ steps.push-worker.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          test -n "$DIGEST_API"
          test -n "$DIGEST_WORKER"
          cosign sign --yes "${IMAGE}@${DIGEST_API}"
          cosign sign --yes "${IMAGE}@${DIGEST_WORKER}"

  deploy:
    needs: [build]
    if: |
      needs.build.result == 'success' &&
      vars.COOLIFY_IMAGE_DEPLOY == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_dispatch' || inputs.deploy)
    # GitHub UI (YAML cannot set): required reviewers; deployment branches
    # main plus v* tags; do not add a wait timer that blocks this private-repo CI.
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: coolify-nest-deploy
      cancel-in-progress: false
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Deploy API then worker
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          API_UUID: ${{ vars.COOLIFY_APP_API }}
          WORKER_UUID: ${{ vars.COOLIFY_APP_WORKER }}
          SHA_TAG: ${{ needs.build.outputs.sha_tag }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -euo pipefail
          test -n "$COOLIFY_TOKEN"
          test -n "$COOLIFY_URL"
          test -n "$API_UUID"
          test -n "$WORKER_UUID"
          test -n "$SHA_TAG"
          test -n "$IMAGE"

          coolify_get() {
            curl -fsS -X GET "${COOLIFY_URL}/api/v1/applications/${1}" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              -H "Accept: application/json"
          }

          coolify_pin() {
            local uuid="$1" tag="$2"
            curl -fsS -X PATCH "${COOLIFY_URL}/api/v1/applications/${uuid}" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -d "{\"docker_registry_image_name\":\"${IMAGE}\",\"docker_registry_image_tag\":\"${tag}\"}"
            # Coolify 4.3.14: GET /api/v1/deploy is 405; POST JSON body is the working verb.
            curl -fsS -X POST "${COOLIFY_URL}/api/v1/deploy" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -d "{\"uuid\":\"${uuid}\",\"force\":true}"
          }

          changed_api=0
          changed_worker=0

          rollback_changed() {
            echo "Rolling back already-changed apps"
            if [ "$changed_worker" = "1" ]; then
              if [ -n "$PREV_WORKER" ]; then
                coolify_pin "$WORKER_UUID" "$PREV_WORKER" || true
              else
                echo "Rollback impossible for clared-worker (previous docker_registry_image_tag is empty)"
              fi
            fi
            if [ "$changed_api" = "1" ]; then
              if [ -n "$PREV_API" ]; then
                coolify_pin "$API_UUID" "$PREV_API" || true
              else
                echo "Rollback impossible for clared-api (previous docker_registry_image_tag is empty)"
              fi
            fi
          }

          API_JSON=$(coolify_get "$API_UUID")
          WORKER_JSON=$(coolify_get "$WORKER_UUID")
          PREV_API=$(printf '%s' "$API_JSON" | jq -r '.docker_registry_image_tag // empty')
          PREV_WORKER=$(printf '%s' "$WORKER_JSON" | jq -r '.docker_registry_image_tag // empty')

          trap rollback_changed ERR

          coolify_pin "$API_UUID" "$SHA_TAG"
          changed_api=1

          # F-B5 / audit 6.2: poll /health/ready 30×10s then PATCH PREV_TAG.
          # Live GET https://clared-api.puzzlessdev.online/health/ready was HTTP 200
          # on 2026-09-04. A fail-deploy drill stays human (phasenplan 4b).
          # Do not add a simulate-fail input that would roll back production.
          poll_ok=0
          for _ in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" \
              "https://clared-api.puzzlessdev.online/health/ready" || true)
            if [ "$code" = "200" ]; then
              poll_ok=1
              break
            fi
            sleep 10
          done
          if [ "$poll_ok" != "1" ]; then
            echo "Health poll failed for clared-api"
            exit 1
          fi

          coolify_pin "$WORKER_UUID" "${SHA_TAG}-worker"
          changed_worker=1

          poll_ok=0
          for _ in $(seq 1 30); do
            STATUS_JSON=$(curl -fsS -X GET "${COOLIFY_URL}/api/v1/applications/${WORKER_UUID}" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              -H "Accept: application/json" || true)
            STATUS=$(printf '%s' "${STATUS_JSON:-}" | jq -r '.status // empty' 2>/dev/null || true)
            STATUS_LC=$(printf '%s' "$STATUS" | tr '[:upper:]' '[:lower:]')
            case "$STATUS_LC" in
              *running*)
                poll_ok=1
                break
                ;;
            esac
            sleep 10
          done
          if [ "$poll_ok" != "1" ]; then
            echo "Status poll failed for clared-worker"
            exit 1
          fi

          trap - ERR
