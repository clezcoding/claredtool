name: desktop-build
run-name: ${{ github.event_name == 'workflow_dispatch' && format('desktop-build · {0} · {1} · publish={2}', inputs.target, github.ref_name, inputs.publish) || format('desktop-build · release · {0}', github.ref_name) }}
# Signed Win/macOS bundles run on v* tags and workflow_dispatch; typecheck/tests stay in ci.yml.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: FaynoSync environment for publish job
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      publish:
        description: Upload signed updater artifacts to FaynoSync
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  validate-ref:
    name: validate signing ref
    timeout-minutes: 2
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Allow only main or v* tags
        env:
          BUILD_REF: ${{ github.ref }}
        run: |
          case "$BUILD_REF" in
            refs/heads/main|refs/tags/v*) ;;
            *)
              echo "Signed desktop builds are restricted to main and v* tags; got ${BUILD_REF}"
              exit 1
              ;;
          esac

  tauri:
    needs: validate-ref
    timeout-minutes: 90
    # cancel-in-progress: false for v* tags and workflow_dispatch (D-14, D-31)
    concurrency:
      group: desktop-tauri-${{ startsWith(github.ref, 'refs/tags/v') && 'production' || (github.event_name == 'workflow_dispatch' && 'manual' || 'staging') }}-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: false
    strategy:
      fail-fast: ${{ github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v') }}
      matrix:
        # D-04: pin windows-2025 and macos-26 (arm64) from actions/runner-images 2026-09;
        # not floating latest labels; not macos-26-xlarge (paid larger runner); not windows-2025-vs2026.
        os: [windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # No Actions cache: this job publishes signed updater artifacts.
      # zizmor cache-poisoning (G1). setup-node v6+ caches npm by default.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.97.1"
          components: ""

      - run: pnpm install --frozen-lockfile

      - name: Resolve build environment
        id: build_env
        shell: bash
        env:
          TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}
        run: |
          if [ "$TARGET" = "production" ]; then
            ENDPOINT="https://updates.puzzlessdev.online/checkVersion?app_name=clared&version={{current_version}}&platform={{target}}&arch={{arch}}&channel=stable&updater=tauri&owner=admin"
            SENTRY_ENV="prod"
          else
            ENDPOINT="https://updates-staging.puzzlessdev.online/checkVersion?app_name=clared&version={{current_version}}&platform={{target}}&arch={{arch}}&channel=stable&updater=tauri&owner=admin"
            SENTRY_ENV="staging"
          fi
          {
            echo "target=$TARGET"
            echo "updater_endpoint=$ENDPOINT"
            echo "sentry_environment=$SENTRY_ENV"
          } >> "$GITHUB_OUTPUT"

      - name: Build desktop bundles (signed updater artifacts)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_UPDATER_ENDPOINT: ${{ steps.build_env.outputs.updater_endpoint }}
          VITE_SENTRY_ENVIRONMENT: ${{ steps.build_env.outputs.sentry_environment }}
          SENTRY_ENVIRONMENT: ${{ steps.build_env.outputs.sentry_environment }}
        run: pnpm --filter ./apps/desktop tauri:build

      - name: Upload Windows bundle
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-bundle
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 14 || 3 }}

      - name: Upload macOS bundle
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-bundle
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 14 || 3 }}

      - name: Step summary
        if: always()
        shell: bash
        env:
          TARGET: ${{ steps.build_env.outputs.target }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          {
            echo "## desktop-build"
            echo "- event: ${EVENT}"
            echo "- ref: ${REF_NAME}"
            echo "- target: ${TARGET}"
            if [ "$RUNNER_OS" = "Windows" ]; then
              echo "- artifacts: windows-bundle (nsis exe+sig, msi)"
            else
              echo "- artifacts: macos-bundle (dmg, app.tar.gz+sig)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    timeout-minutes: 10
    needs: tauri
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-bundle"
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        # zizmor: ignore[superfluous-actions] — Plan 04 GH Release job; keep SHA-pinned action
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            artifacts/**/*.msi
            artifacts/**/*.dmg
          fail_on_unmatched_files: true

  publish-faynosync:
    timeout-minutes: 20
    # cancel-in-progress: false for v* tags and workflow_dispatch (D-14, D-31)
    concurrency:
      group: desktop-publish-${{ startsWith(github.ref, 'refs/tags/v') && 'production' || (github.event_name == 'workflow_dispatch' && 'manual' || 'staging') }}-${{ github.ref }}
      cancel-in-progress: false
    needs: tauri
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.publish == true) ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}
    env:
      FAYNOSYNC_BASE_URL: ${{ vars.FAYNOSYNC_BASE_URL }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve FaynoSync base URL
        env:
          FS_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.target || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}
        run: |
          if [ -n "$FAYNOSYNC_BASE_URL" ]; then
            echo "Using FAYNOSYNC_BASE_URL from repository variable"
          elif [ "$FS_ENV" = "production" ]; then
            echo "FAYNOSYNC_BASE_URL=https://updates.puzzlessdev.online" >> "$GITHUB_ENV"
          else
            echo "FAYNOSYNC_BASE_URL=https://updates-staging.puzzlessdev.online" >> "$GITHUB_ENV"
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-bundle"
          path: artifacts
          merge-multiple: true

      - name: Read app version
        id: meta
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "v* tag ${GITHUB_REF_NAME} (without leading v: ${TAG_VERSION}) disagrees with tauri.conf.json version ${VERSION}"
              exit 1
            fi
          fi

      - name: FaynoSync whoami (CI token preflight)
        env:
          FAYNOSYNC_CI_TOKEN: ${{ secrets.FAYNOSYNC_CI_TOKEN }}
        run: |
          curl -sfS "$FAYNOSYNC_BASE_URL/whoami" \
            -H "Authorization: Bearer $FAYNOSYNC_CI_TOKEN"

      - name: Upload macOS updater to FaynoSync
        env:
          FAYNOSYNC_CI_TOKEN: ${{ secrets.FAYNOSYNC_CI_TOKEN }}
          FS_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t MAC_FILES < <(find artifacts -type f -name '*.app.tar.gz' ! -name '*.sig' | sort)
          if [ "${#MAC_FILES[@]}" -ne 1 ]; then
            echo "expected exactly one macOS updater artifact (.app.tar.gz), found ${#MAC_FILES[@]}"
            printf '%s\n' "${MAC_FILES[@]}"
            exit 1
          fi
          MAC_FILE="${MAC_FILES[0]}"
          MAC_SIG_FILE="${MAC_FILE}.sig"
          test -f "$MAC_SIG_FILE"
          BASE=$(basename "$MAC_FILE")
          # Tauri names this Clared.app.tar.gz — version/arch live in the FaynoSync JSON, not the basename.
          case "$BASE" in
            *.app.tar.gz) ;;
            *) echo "basename ${BASE} is not a darwin updater tarball"; exit 1 ;;
          esac
          SIG=$(tr -d '\n' < "$MAC_SIG_FILE")
          DATA=$(jq -nc \
            --arg version "$FS_VERSION" \
            --arg signature "$SIG" \
            --arg changelog "Clared ${FS_VERSION} (macOS aarch64)" \
            '{
              app_name: "clared",
              version: $version,
              channel: "stable",
              publish: true,
              platform: "darwin",
              arch: "aarch64",
              updater: "tauri",
              signature: $signature,
              changelog: $changelog
            }')
          HTTP_CODE=$(curl -sS -o /tmp/fayno-mac.json -w "%{http_code}" -X POST "$FAYNOSYNC_BASE_URL/upload" \
            -H "Authorization: Bearer $FAYNOSYNC_CI_TOKEN" \
            -F "file=@${MAC_FILE}" \
            -F "data=${DATA}")
          if [ "$HTTP_CODE" -lt 400 ]; then
            echo "FaynoSync macOS upload HTTP ${HTTP_CODE}"
            jq -e -c '{version, id}' /tmp/fayno-mac.json
          elif { [ "$HTTP_CODE" = "409" ] || [ "$HTTP_CODE" = "500" ]; } \
            && grep -q 'app with this name, version, platform, architecture and extension already exists' /tmp/fayno-mac.json; then
            echo "FaynoSync already has this macOS artifact (HTTP ${HTTP_CODE})"
          else
            echo "FaynoSync upload failed HTTP ${HTTP_CODE}"
            cat /tmp/fayno-mac.json
            exit 1
          fi

      - name: Upload Windows updater to FaynoSync
        env:
          FAYNOSYNC_CI_TOKEN: ${{ secrets.FAYNOSYNC_CI_TOKEN }}
          FS_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t WIN_FILES < <(find artifacts -type f -path '*/nsis/*.exe' ! -name '*.sig' | sort)
          if [ "${#WIN_FILES[@]}" -ne 1 ]; then
            echo "expected exactly one Windows NSIS updater artifact (.exe), found ${#WIN_FILES[@]}"
            printf '%s\n' "${WIN_FILES[@]}"
            exit 1
          fi
          WIN_FILE="${WIN_FILES[0]}"
          WIN_SIG_FILE="${WIN_FILE}.sig"
          test -f "$WIN_SIG_FILE"
          BASE=$(basename "$WIN_FILE")
          case "$BASE" in
            *.exe) ;;
            *) echo "basename ${BASE} is not an NSIS exe"; exit 1 ;;
          esac
          case "$WIN_FILE" in
            */nsis/*.exe) ;;
            *) echo "path ${WIN_FILE} is not under nsis/"; exit 1 ;;
          esac
          SIG=$(tr -d '\n' < "$WIN_SIG_FILE")
          DATA=$(jq -nc \
            --arg version "$FS_VERSION" \
            --arg signature "$SIG" \
            --arg changelog "Clared ${FS_VERSION} (Windows x86_64)" \
            '{
              app_name: "clared",
              version: $version,
              channel: "stable",
              publish: true,
              platform: "windows",
              arch: "x64",
              updater: "tauri",
              signature: $signature,
              changelog: $changelog
            }')
          HTTP_CODE=$(curl -sS -o /tmp/fayno-win.json -w "%{http_code}" -X POST "$FAYNOSYNC_BASE_URL/upload" \
            -H "Authorization: Bearer $FAYNOSYNC_CI_TOKEN" \
            -F "file=@${WIN_FILE}" \
            -F "data=${DATA}")
          if [ "$HTTP_CODE" -lt 400 ]; then
            echo "FaynoSync Windows upload HTTP ${HTTP_CODE}"
            jq -e -c '{version, id}' /tmp/fayno-win.json
          elif { [ "$HTTP_CODE" = "409" ] || [ "$HTTP_CODE" = "500" ]; } \
            && grep -q 'app with this name, version, platform, architecture and extension already exists' /tmp/fayno-win.json; then
            echo "FaynoSync already has this Windows artifact (HTTP ${HTTP_CODE})"
          else
            echo "FaynoSync upload failed HTTP ${HTTP_CODE}"
            cat /tmp/fayno-win.json
            exit 1
          fi

      - name: Verify FaynoSync checkVersion (macOS)
        run: |
          curl -sfS \
            "$FAYNOSYNC_BASE_URL/checkVersion?app_name=clared&version=0.0.0&platform=darwin&arch=aarch64&channel=stable&updater=tauri&owner=admin" \
            | jq -e '.version'

      - name: Verify FaynoSync checkVersion (Windows)
        run: |
          set -euo pipefail
          TAURI_ARCH_URL="$FAYNOSYNC_BASE_URL/checkVersion?app_name=clared&version=0.0.0&platform=windows&arch=x86_64&channel=stable&updater=tauri&owner=admin"
          FAYNOSYNC_ARCH_URL="$FAYNOSYNC_BASE_URL/checkVersion?app_name=clared&version=0.0.0&platform=windows&arch=x64&channel=stable&updater=tauri&owner=admin"
          TAURI_CODE=$(curl -sS -o /tmp/fayno-win-tauri-arch.json -w "%{http_code}" "$TAURI_ARCH_URL")
          test "$TAURI_CODE" = "400"
          grep -q "invalid arch parameter" /tmp/fayno-win-tauri-arch.json
          curl -sfS "$FAYNOSYNC_ARCH_URL" | jq -e '.version'
