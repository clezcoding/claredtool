name: desktop-build

on:
  push:
    branches: [main]
    paths:
      - apps/desktop/**
      - .github/workflows/desktop-build.yml
  pull_request:
    paths:
      - apps/desktop/**
      - .github/workflows/desktop-build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tauri:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          cache-on-failure: true

      - run: pnpm install

      - name: Build desktop bundles (signed updater artifacts)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: pnpm --filter ./apps/desktop tauri build

      - name: Upload Windows bundle
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-bundle
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload macOS bundle
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: macos-bundle
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

      # FaynoSync upload (D-10): CI uploads signed NSIS/.app.tar.gz + .sig to prod
      # https://updates.puzzlessdev.online after release cut. Staging builds must set
      # TAURI_UPDATER_ENDPOINT / VITE_UPDATER_ENDPOINT to updates-staging host (D-12).
