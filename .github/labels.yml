# Source of truth for repo labels. Synced by .github/workflows/sync-labels.yml
# Names must match .kodiak.toml and dependabot.yml exactly.
# Format: https://github.com/crazy-max/ghaction-github-labeler#yaml-configuration

- name: bug
  color: "d73a4a"
  description: Something isn't working
- name: enhancement
  color: "a2eeef"
  description: New feature or request
- name: documentation
  color: "0075ca"
  description: Improvements or additions to documentation
- name: duplicate
  color: "cfd3d7"
  description: This issue or pull request already exists
- name: good first issue
  color: "7057ff"
  description: Good for newcomers
- name: help wanted
  color: "008672"
  description: Extra attention is needed
- name: invalid
  color: "e4e669"
  description: This doesn't seem right
- name: question
  color: "d876e3"
  description: Further information is requested
- name: wontfix
  color: "ffffff"
  description: This will not be worked on
- name: accessibility
  color: "f143ab"
  description: Barrier affecting people with disabilities
- name: automerge
  color: "0e8a16"
  description: "Kodiak: merge when required checks are green"
- name: autoupdate
  color: "1d76db"
  description: "Kodiak: keep this branch up to date with main"
- name: do-not-merge
  color: "b60205"
  description: Block Kodiak and human merge
- name: wip
  color: "fbca04"
  description: Work in progress — not ready to merge
- name: dependencies
  color: "0366d6"
  description: Dependency update
- name: npm
  color: "cb3837"
  description: npm / pnpm ecosystem
- name: cargo
  color: "dea584"
  description: Rust / Cargo ecosystem
- name: github-actions
  color: "000000"
  description: GitHub Actions ecosystem
- name: security
  color: "ee0701"
  description: Security vulnerability or hardening
- name: major
  color: "b60205"
  description: SemVer major (Dependabot applies this automatically)
- name: minor
  color: "fbca04"
  description: SemVer minor (Dependabot applies this automatically)
- name: patch
  color: "0e8a16"
  description: SemVer patch (Dependabot applies this automatically)
- name: desktop
  color: "5319e7"
  description: apps/desktop (Tauri client)
- name: ui
  color: "d4c5f9"
  description: packages/ui design system
- name: ci
  color: "ededed"
  description: CI workflows and GitHub automation
- name: planning
  color: "c2e0c6"
  description: ".planning GSD artifacts"
- name: architect
  color: "6f42c1"
  description: "Triage role: architect"
- name: implementer
  color: "0052cc"
  description: "Triage role: implementer"
- name: reviewer
  color: "1d76db"
  description: "Triage role: reviewer"
- name: documenter
  color: "0075ca"
  description: "Triage role: documenter"
- name: tester
  color: "0e8a16"
  description: "Triage role: tester"
- name: needs-triage
  color: "fbca04"
  description: Maintainer needs to evaluate this issue
- name: needs-info
  color: "d4c5f9"
  description: Waiting on reporter for more information
- name: ready-for-agent
  color: "0e8a16"
  description: Fully specified, ready for an AFK agent
- name: ready-for-human
  color: "0052cc"
  description: Requires human implementation
