# Source of truth for repo labels. Synced by .github/workflows/sync-labels.yml
# Kodiak / Dependabot names must match .kodiak.toml and dependabot.yml exactly.

bug:
  color: "d73a4a"
  description: Something isn't working
enhancement:
  color: "a2eeef"
  description: New feature or request
documentation:
  color: "0075ca"
  description: Improvements or additions to documentation
duplicate:
  color: "cfd3d7"
  description: This issue or pull request already exists
good first issue:
  color: "7057ff"
  description: Good for newcomers
help wanted:
  color: "008672"
  description: Extra attention is needed
invalid:
  color: "e4e669"
  description: This doesn't seem right
question:
  color: "d876e3"
  description: Further information is requested
wontfix:
  color: "ffffff"
  description: This will not be worked on
accessibility:
  color: "f143ab"
  description: Barrier affecting people with disabilities

automerge:
  color: "0e8a16"
  description: "Kodiak: merge when required checks are green"
autoupdate:
  color: "1d76db"
  description: "Kodiak: keep this branch up to date with main"
do-not-merge:
  color: "b60205"
  description: Block Kodiak and human merge
wip:
  color: "fbca04"
  description: Work in progress — not ready to merge

dependencies:
  color: "0366d6"
  description: Dependency update
npm:
  color: "cb3837"
  description: npm / pnpm ecosystem
cargo:
  color: "dea584"
  description: Rust / Cargo ecosystem
github-actions:
  color: "000000"
  description: GitHub Actions ecosystem
security:
  color: "ee0701"
  description: Security vulnerability or hardening

major:
  color: "b60205"
  description: SemVer major (Dependabot applies this automatically)
minor:
  color: "fbca04"
  description: SemVer minor (Dependabot applies this automatically)
patch:
  color: "0e8a16"
  description: SemVer patch (Dependabot applies this automatically)

desktop:
  color: "5319e7"
  description: apps/desktop (Tauri client)
ui:
  color: "d4c5f9"
  description: packages/ui design system
ci:
  color: "ededed"
  description: CI workflows and GitHub automation
planning:
  color: "c2e0c6"
  description: ".planning GSD artifacts"

architect:
  color: "6f42c1"
  description: "Triage role: architect"
implementer:
  color: "0052cc"
  description: "Triage role: implementer"
reviewer:
  color: "1d76db"
  description: "Triage role: reviewer"
documenter:
  color: "0075ca"
  description: "Triage role: documenter"
tester:
  color: "0e8a16"
  description: "Triage role: tester"
